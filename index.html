<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>日期归档</title>
<style>
:root{font-family:"PingFang SC","Helvetica Neue",sans-serif;color:#21312c;background:#f5f5f0;font-size:15px}*{box-sizing:border-box}body{margin:0}main{max-width:960px;margin:48px auto;padding:0 28px}header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid #d5dcd5;padding-bottom:22px}h1{font-size:26px;letter-spacing:-1px;margin:0}header span,.muted{color:#66766d;font-size:13px}section{margin-top:30px}label{display:block;font-size:13px;font-weight:600;margin-bottom:9px}input{width:100%;border:1px solid #c9d2ca;border-radius:7px;padding:12px;background:#fff;font:inherit;color:inherit;min-width:0}input:focus,button:focus-visible{outline:2px solid #27735c;outline-offset:2px}.row{display:flex;gap:10px}.row input{flex:1}.fields{display:grid;grid-template-columns:190px 1fr;gap:20px}button{border:1px solid #c9d2ca;border-radius:7px;padding:11px 17px;background:white;color:#21312c;cursor:pointer;font:inherit;white-space:nowrap}button:hover{background:#edf2ec}button:disabled{opacity:.5;cursor:wait}.primary{background:#24624e;color:white;border-color:#24624e;font-weight:600}.primary:hover{background:#194c3b}#drop{border:1.5px dashed #96ac9d;padding:34px 20px;text-align:center;border-radius:10px;background:#fbfcf8;cursor:pointer}#drop.over{background:#e4eee4;border-color:#24624e}#drop strong{display:block;font-size:17px;margin-bottom:8px}#drop span{color:#66766d;font-size:13px}#files{padding:0;list-style:none}#files li{display:flex;align-items:center;gap:10px;border-bottom:1px solid #dce2da;padding:8px 0}#files li span:first-child{flex:1;overflow-wrap:anywhere}#files button{padding:4px 10px;font-size:12px}.preview{background:#e9eee6;padding:18px 20px;border-radius:8px;margin-top:30px}.preview small{display:block;color:#66766d;margin-bottom:9px}.preview b{font-size:19px;overflow-wrap:anywhere}.preview p{font-size:12px;overflow-wrap:anywhere;margin-bottom:0;color:#66766d}footer{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:15px}#status{white-space:pre-wrap;margin:20px 0;line-height:1.7;overflow-wrap:anywhere}#status.error{color:#a33128}#status.success{color:#24624e}#history{border-top:1px solid #d5dcd5;padding-top:20px;margin-top:38px}#history h2{font-size:15px}#history button{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;margin-top:8px;font-size:13px;text-align:left}#picker{display:none}@media(max-width:650px){main{margin:24px auto;padding:0 18px}.fields{grid-template-columns:1fr}header{align-items:start;gap:10px}header span{max-width:130px}footer{align-items:start;flex-direction:column}.row{flex-wrap:wrap}}
#mailPanel{display:block} </style>
<main><header><h1>日期归档</h1><span>把资料放回事情发生的那一天</span></header>
<section><label for="base">归档位置</label><div class="row"><input id="base" value="__DEFAULT__"><button id="choose">选择目录</button></div></section>
<section class="fields"><div><label for="date">日期</label><input id="date" type="date" required></div><div><label for="event">事项</label><input id="event" placeholder="例如：去江苏大学交流" maxlength="70"></div></section>
<section><label>PDF 文件</label><div id="drop" role="button" tabindex="0"><strong>拖入 PDF，或点击选择</strong><span>支持一次添加多份 · 保留原文件 · 每批最多 200 MB</span></div><input type="file" accept="application/pdf,.pdf" multiple id="picker"><ul id="files"></ul></section>
<div class="preview"><small>将归档到</small><b id="folderName">请选择日期并填写事项</b><p id="fullPath"></p></div>
<footer><span class="muted">已有文件夹会继续使用；同名文件自动加编号。</span><button id="save" class="primary">创建文件夹并归档</button></footer>
<div id="status" role="status" aria-live="polite"></div><button id="open" hidden>在 Finder 中打开</button>
<section id="mailPanel"><h2 style="font-size:20px">通行费邮件自动归档</h2><p class="muted">配置自己的邮箱 · 学校为推测，请核对 · 应用运行时每 15 分钟检查一次</p><label for="mailAccount">邮箱账号</label><input id="mailAccount" type="email" placeholder="you@example.com"><label for="mailServer">IMAP 服务器</label><input id="mailServer" placeholder="imap.example.com"><label for="mailPort">IMAP SSL 端口</label><input id="mailPort" type="number" value="993"><label for="project">默认项目编号（可空）</label><input id="project"><label for="origin">出发城市（可空）</label><input id="origin"><label for="mealRate">每日伙食补助（示例，非官方标准）</label><input id="mealRate" type="number" min="0" step="0.01"><label for="trafficRate">每日交通补助（示例，非官方标准）</label><input id="trafficRate" type="number" min="0" step="0.01"><label for="mailCode">IMAP 授权码</label><input id="mailCode" type="password" autocomplete="off" placeholder="首次填写；保存到系统钥匙串，留空保留原授权码"><p class="muted">先在邮箱设置中开启 IMAP，使用客户端授权码。首次运行不会连接邮箱。</p><label for="mailBase">自动归档位置</label><input id="mailBase"><div class="row" style="margin-top:15px;align-items:center"><label style="margin:0"><input id="mailEnabled" type="checkbox" style="width:auto"> 启用定时同步</label><label style="margin:0">回溯天数 <input id="mailDays" type="number" min="1" max="3650" value="90" style="width:95px"></label><button id="mailSave">保存设置</button><button id="mailSync" class="primary">立即同步</button></div><p id="mailStatus" role="status"></p><div id="mailItems"></div></section>
<section id="history" hidden><h2>最近归档</h2><div id="historyItems"></div></section></main>
<script>
const $=id=>document.getElementById(id), token='__TOKEN__';let files=[],lastFolder='',busy=false;
let history=[];try{history=JSON.parse(localStorage.getItem('dateArchivePublicHistory')||'[]');$('base').value=localStorage.getItem('dateArchivePublicBase')||$('base').value}catch(e){}
const now=new Date();$('date').value=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');
function preview(){const name=$('date').value.replaceAll('-','')+$('event').value.trim();$('folderName').textContent=$('date').value&&$('event').value.trim()?name:'请选择日期并填写事项';$('fullPath').textContent=$('base').value.replace(/\/$/,'')+'/'+name}
['date','event','base'].forEach(id=>$(id).addEventListener('input',preview));preview();
function status(text,error=false){$('status').textContent=text;$('status').className=error?'error':'success'}
function renderFiles(){$('files').replaceChildren();files.forEach((f,i)=>{let li=document.createElement('li'),name=document.createElement('span'),size=document.createElement('span'),remove=document.createElement('button');name.textContent=f.name;size.className='muted';size.textContent=(f.size/1024/1024).toFixed(2)+' MB';remove.textContent='移除';remove.disabled=busy;remove.onclick=()=>{files.splice(i,1);renderFiles()};li.append(name,size,remove);$('files').append(li)})}
function add(list){if(busy)return;let rejected=[];for(const f of list){if(!f.name.toLowerCase().endsWith('.pdf')){rejected.push(f.name);continue}if(!files.some(x=>x.name===f.name&&x.size===f.size&&x.lastModified===f.lastModified))files.push(f)}renderFiles();status(rejected.length?'仅支持 PDF，未添加：'+rejected.join('、'):'',!!rejected.length)}
$('drop').onclick=()=>$('picker').click();$('drop').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('picker').click()}};$('picker').onchange=e=>{add(e.target.files);e.target.value=''};
for(const type of ['dragover','dragenter'])$('drop').addEventListener(type,e=>{e.preventDefault();$('drop').classList.add('over')});$('drop').ondragleave=()=>$('drop').classList.remove('over');$('drop').ondrop=e=>{e.preventDefault();$('drop').classList.remove('over');add(e.dataTransfer.files)};window.addEventListener('dragover',e=>e.preventDefault());window.addEventListener('drop',e=>e.preventDefault());
async function api(route,data){const r=await fetch('/api/'+route,{method:'POST',headers:{'Content-Type':'application/json','X-Archive-Token':token},body:JSON.stringify(data)});const result=await r.json();if(!r.ok)throw Error(result.error||'操作失败');return result}
$('choose').onclick=async()=>{try{const r=await api('choose',{});if(r.path){$('base').value=r.path.replace(/\/$/,'');preview()}}catch(e){status(e.message,true)}};
async function openFolder(folder){try{await api('open',{folder})}catch(e){status(e.message,true)}}$('open').onclick=()=>openFolder(lastFolder);
function renderHistory(){$('history').hidden=!history.length;$('historyItems').replaceChildren();history.forEach(h=>{const b=document.createElement('button');b.textContent=h.name+' · '+h.count+' 份 PDF';b.title=h.folder;b.onclick=()=>openFolder(h.folder);$('historyItems').append(b)})}renderHistory();
function encode(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve({name:file.name,data:r.result.split(',')[1]});r.onerror=()=>reject(Error('无法读取 '+file.name));r.readAsDataURL(file)})}
$('save').onclick=async()=>{if(busy)return;if(!$('date').value||!$('event').value.trim()||!files.length){status('请选择日期、填写事项，并添加至少一份 PDF。',true);return}if(files.reduce((a,f)=>a+f.size,0)>200*1024*1024){status('每批文件请控制在 200 MB 以内。',true);return}busy=true;for(const id of ['save','choose','base','date','event','picker'])$(id).disabled=true;renderFiles();$('open').hidden=true;status('正在归档，请稍候…');try{const payload=await Promise.all(files.map(encode));const r=await api('archive',{base:$('base').value,date:$('date').value,event:$('event').value,files:payload});lastFolder=r.folder;status('已归档 '+r.files.length+' 份 PDF\n'+r.folder+'\n'+r.files.join('、'));$('open').hidden=false;history=[{folder:r.folder,name:r.folder.split('/').pop(),count:r.files.length},...history.filter(h=>h.folder!==r.folder)].slice(0,8);try{localStorage.setItem('dateArchivePublicBase',$('base').value);localStorage.setItem('dateArchivePublicHistory',JSON.stringify(history))}catch(e){}renderHistory();files=[]}catch(e){status(e.message,true)}finally{busy=false;for(const id of ['save','choose','base','date','event','picker'])$(id).disabled=false;renderFiles()}};
let mailLoaded=false, mailFingerprint='';
async function refreshMail(){try{const s=await api('mail/status',{});if(!mailLoaded){$('mailBase').value=s.base;$('mailAccount').value=s.account;$('mailServer').value=s.imap_server;$('mailPort').value=s.imap_port;$('project').value=s.project;$('origin').value=s.origin;$('mealRate').value=s.meal_rate;$('trafficRate').value=s.traffic_rate;$('mailEnabled').checked=s.enabled;$('mailDays').value=s.days;mailLoaded=true}$('mailStatus').textContent=s.syncing?'正在自动下载、命名和归档…':s.error?'同步提示：'+s.error:'上次同步：'+(s.last_sync||'尚未同步');$('mailItems').replaceChildren();for(const item of s.items){const box=document.createElement('div');box.style='border-top:1px solid #c9d2ca;padding:18px 0';const title=document.createElement('b');title.textContent=item.state==='archived'?item.folder.split('/').pop():'自动处理中';const info=document.createElement('p');info.textContent=(item.state==='archived'?'已归档':'已下载')+' '+item.files.length+' 份 PDF · '+(item.folder||item.auto_error||'正在自动命名');box.append(title,info);if(item.folder){const open=document.createElement('button');open.textContent='打开文件夹';open.onclick=()=>openFolder(item.folder);box.append(open);const report=document.createElement('button');report.textContent='打开报销信息';report.style.marginLeft='10px';report.onclick=()=>api('report',{folder:item.folder}).catch(e=>$('mailStatus').textContent=e.message);box.append(report)}$('mailItems').append(box)}}catch(e){$('mailStatus').textContent=e.message}}
$('mailSave').onclick=async()=>{try{await api('mail/config',{account:$('mailAccount').value,imap_server:$('mailServer').value,imap_port:Number($('mailPort').value),project:$('project').value,origin:$('origin').value,meal_rate:$('mealRate').value,traffic_rate:$('trafficRate').value,base:$('mailBase').value,password:$('mailCode').value,enabled:$('mailEnabled').checked,days:Number($('mailDays').value)});$('mailCode').value='';$('mailStatus').textContent='设置已保存；授权码保存在系统钥匙串。'}catch(e){$('mailStatus').textContent=e.message}};
$('mailSync').onclick=async()=>{try{await api('mail/sync',{});$('mailStatus').textContent='正在同步邮箱…';setTimeout(refreshMail,1000)}catch(e){$('mailStatus').textContent=e.message}};refreshMail();setInterval(refreshMail,10000);
</script></html>
